name: Build image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps.json
      - .github/workflows/build.yml

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  FRAPPE_DOCKER_REF: v4.0.0
  FRAPPE_BRANCH: v16.36.1
  IMAGE: ghcr.io/vladimirfalkov/erp

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout erp-deploy
        uses: actions/checkout@v4

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: ${{ env.FRAPPE_DOCKER_REF }}
          path: frappe_docker

      - name: Resolve myerp commit
        id: myerp
        env:
          MYERP_READ_TOKEN: ${{ secrets.MYERP_READ_TOKEN }}
        run: |
          set -euo pipefail
          url=$(jq -r '.[] | select(.url | endswith("/myerp")) | .url' apps.json)
          branch=$(jq -r '.[] | select(.url | endswith("/myerp")) | .branch' apps.json)
          authed_url="${url/https:\/\//https://x-access-token:${MYERP_READ_TOKEN}@}"
          sha=$(git ls-remote "$authed_url" "$branch" | cut -f1)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha::7}" >> "$GITHUB_OUTPUT"

      - name: Prepare apps.json with token
        env:
          MYERP_READ_TOKEN: ${{ secrets.MYERP_READ_TOKEN }}
        run: |
          set -euo pipefail
          jq --arg t "$MYERP_READ_TOKEN" \
            'map(if (.url | endswith("/myerp"))
                 then .url |= sub("^https://"; "https://x-access-token:\($t)@")
                 else . end)' \
            apps.json > "$RUNNER_TEMP/apps.json"

      - name: Compute tags
        id: meta
        run: |
          tag="${FRAPPE_BRANCH#v}-${{ steps.myerp.outputs.short }}-${GITHUB_RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "cache_bust=$(sha256sum apps.json | cut -c1-16)-${{ steps.myerp.outputs.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            CACHE_BUST=${{ steps.meta.outputs.cache_bust }}
          secret-files: |
            apps_json=${{ runner.temp }}/apps.json
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            erp.myerp.revision=${{ steps.myerp.outputs.sha }}
            erp.frappe.version=${{ env.FRAPPE_BRANCH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/apps.json"

      - name: Summary
        run: |
          {
            echo "### Image"
            echo '```'
            echo "${IMAGE}:${{ steps.meta.outputs.tag }}"
            echo '```'
            echo "myerp: \`${{ steps.myerp.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
